name: eval-gate

# 评测门禁:PR 触发在线评测子集,对比 baselines/agent.json,退化超容差即红。
# 单元测试全绿 ≠ 执行质量没退化 —— 提示词/工具改动的回归只有轨迹评测能抓。
# 需要仓库 secret TAG_LLM_API_KEY(智谱兼容 key);未配置时 warning 跳过,
# 离线门禁由 ci.yml 承担。

on:
  pull_request:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync
      - name: Eval gate(20 条子集 × 基线对比)
        env:
          TAG_LLM_API_KEY: ${{ secrets.TAG_LLM_API_KEY }}
        run: |
          if [ -z "$TAG_LLM_API_KEY" ]; then
            echo "::warning::TAG_LLM_API_KEY 未配置,评测门禁跳过(离线门禁见 ci.yml)"
            exit 0
          fi
          # 容差依据 baselines/tolerance.json:同代码 3 轮极差 0(temperature=0
          # + 独立世界),0.05 = 子集内单 case 翻转粒度,只拦真实退化。
          # 基线必须同口径(同子集同遍数):全量基线 vs 子集跑分恒"提升",
          # 门禁灵敏度归零 —— ci-subset.json 由 --limit 20 --repeats 1 落盘
          uv run python scripts/run_eval.py \
            --limit 20 --repeats 1 \
            --gate baselines/ci-subset.json --tolerance 0.05
      - name: Upload scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-scorecard
          path: experiments/eval-report.md
          if-no-files-found: ignore
