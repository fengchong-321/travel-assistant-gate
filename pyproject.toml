[project]
name = "travelgate"
version = "0.1.0"
description = "TravelAssistantGate:门票客服 Agent 的轨迹多维评测工具 —— 规划/工具/过程/世界状态四维断言"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.40",
    "numpy>=2.0",
    "httpx>=0.27",
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["travelgate", "sut_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"  # numpy 2.x 类型存根使用 3.12 的 type 语句,3.11 无法解析
warn_unused_ignores = true
check_untyped_defs = true
